services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATA_DIR: ${DATA_DIR:-/data}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      SEEDVR2_CLI_PATH: ${SEEDVR2_CLI_PATH:-/opt/seedvr2/inference_cli.py}
      SEEDVR2_REPO_DIR: ${SEEDVR2_REPO_DIR:-/opt/seedvr}
      SEEDVR2_MODEL_DIR: ${SEEDVR2_MODEL_DIR:-/models/seedvr2}
      BROWSE_ROOTS: ${BROWSE_ROOTS:-/data:/models:/external}
      MOCK_PIPELINE: ${MOCK_PIPELINE:-true}
      RUN_IN_PROCESS_WORKER: ${RUN_IN_PROCESS_WORKER:-false}
      PREFER_GPU: ${PREFER_GPU:-true}
      REQUIRE_GPU_FOR_REAL_PIPELINE: ${REQUIRE_GPU_FOR_REAL_PIPELINE:-true}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ./data:/data
      - ./models:/models
      - ./seedvr:/opt/seedvr
      - ./external:/external
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    gpus: all

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATA_DIR: ${DATA_DIR:-/data}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      SEEDVR2_CLI_PATH: ${SEEDVR2_CLI_PATH:-/opt/seedvr2/inference_cli.py}
      SEEDVR2_REPO_DIR: ${SEEDVR2_REPO_DIR:-/opt/seedvr}
      SEEDVR2_MODEL_DIR: ${SEEDVR2_MODEL_DIR:-/models/seedvr2}
      BROWSE_ROOTS: ${BROWSE_ROOTS:-/data:/models:/external}
      MOCK_PIPELINE: ${MOCK_PIPELINE:-true}
      PREFER_GPU: ${PREFER_GPU:-true}
      REQUIRE_GPU_FOR_REAL_PIPELINE: ${REQUIRE_GPU_FOR_REAL_PIPELINE:-true}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ./data:/data
      - ./models:/models
      - ./seedvr:/opt/seedvr
      - ./external:/external
    depends_on:
      - backend
    gpus: all

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

  backend-tests:
    profiles:
      - test
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATA_DIR: /tmp/seedvr2-test-data
      DATABASE_URL: sqlite:////tmp/seedvr2-test-data/app.db
      MOCK_PIPELINE: "true"
      PREFER_GPU: "false"
      REQUIRE_GPU_FOR_REAL_PIPELINE: "false"
    command: pytest tests

  frontend-tests:
    profiles:
      - test
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: build
    command: npm run build
